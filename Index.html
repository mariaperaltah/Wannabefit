<script>
const KEY='nutriplan-v1',$=s=>document.querySelector(s),r5=x=>Math.round(x/5)*5,rd=x=>Math.round(x);
// Base de alimentos ampliable: [id,nombre,categoría,rol(P/C/F/V),tipo(m carne,f pescado,e huevo,d lácteo,p vegetal),kcal,prot,grasa,carb,fibra,€/kg,franjas(b/m/s),alérgeno(gl,la,hu,pe,fr,so,ca)] por 100 g. Valores orientativos.
const FOODS=[['pollo','Pechuga de pollo','Carnes y pescados','P','m',165,31,3.6,0,0,8,'m',''],['ternera','Ternera magra','Carnes y pescados','P','m',170,26,7,0,0,13,'m',''],['salmon','Salmón','Carnes y pescados','P','f',208,20,13,0,0,16,'m','pe'],['atun','Atún al natural','Carnes y pescados','P','f',116,26,1,0,0,14,'m','pe'],['huevo','Huevos','Lácteos y huevos','P','e',143,12.6,9.5,.7,0,3.5,'bm','hu'],['yogur','Yogur griego natural','Lácteos y huevos','P','d',97,9,5,3.6,0,3,'bs','la'],['queso','Queso fresco batido 0%','Lácteos y huevos','P','d',46,8,.2,3.5,0,2.5,'bs','la'],['tofu','Tofu firme','Legumbres y soja','P','p',144,15,9,3,2,6,'bm','so'],['lentejas','Lentejas cocidas','Legumbres y soja','P','p',116,9,.4,20,8,2,'m',''],['garbanzos','Garbanzos cocidos','Legumbres y soja','P','p',164,9,2.6,27,8,2,'m',''],['arroz','Arroz cocido','Cereales y tubérculos','C','p',130,2.7,.3,28,.4,1.5,'m',''],['pasta','Pasta cocida','Cereales y tubérculos','C','p',158,5.8,.9,31,1.8,1.5,'m','gl'],['patata','Patata cocida','Cereales y tubérculos','C','p',87,1.9,.1,20,1.8,1,'m',''],['quinoa','Quinoa cocida','Cereales y tubérculos','C','p',120,4.4,1.9,21,2.8,5,'m',''],['avena','Copos de avena','Cereales y tubérculos','C','p',370,13,7,60,10,2.5,'b','gl'],['pan','Pan integral','Cereales y tubérculos','C','p',250,10,3.5,43,7,3,'bs','gl'],['aceite','Aceite de oliva','Grasas y frutos secos','F','p',884,0,100,0,0,8,'m',''],['aguacate','Aguacate','Grasas y frutos secos','F','p',160,2,15,9,7,5,'bms',''],['almendra','Almendras','Grasas y frutos secos','F','p',579,21,50,22,12,12,'bs','fr'],['cacahuete','Crema de cacahuete','Grasas y frutos secos','F','p',588,25,50,20,6,7,'bs','ca'],['brocoli','Brócoli','Verduras y fruta','V','p',34,2.8,.4,7,2.6,2.5,'m',''],['ensalada','Ensalada mixta','Verduras y fruta','V','p',20,1.5,.2,3.5,1.8,3,'m',''],['calabacin','Calabacín salteado','Verduras y fruta','V','p',17,1.2,.3,3,1,2,'m',''],['platano','Plátano','Verduras y fruta','V','p',89,1.1,.3,23,2.6,2,'bs',''],['manzana','Manzana','Verduras y fruta','V','p',52,.3,.2,14,2.4,2,'s',''],['frutos','Frutos rojos','Verduras y fruta','V','p',50,1,.3,12,3,8,'bs','']];
const F={};FOODS.forEach(a=>F[a[0]]={id:a[0],name:a[1],cat:a[2],role:a[3],kind:a[4],k:a[5],p:a[6],f:a[7],c:a[8],fi:a[9],price:a[10],slot:a[11],al:a[12]});
const ALG={gl:'Gluten',la:'Lácteos',hu:'Huevo',pe:'Pescado',fr:'Frutos secos',so:'Soja',ca:'Cacahuete'};
const STEPS=['Bienvenida','Tus datos','Objetivo','Actividad','Hábitos','Resultados','Tu plan','Revisión','Compras','Seguimiento'];
const DEF=()=>({step:0,p:{sexo:'',trab:'sed',tipo:'pesas',nivel:'int',obj:'grasa',ritmo:'mod',estres:'medio',dieta:'omni',nc:3,ns:1,nd:3,alerg:[],intol:[],cond:[]},plan:null,fav:[],buy:null,log:[],ex:false});
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);return Object.assign(DEF(),s,{p:Object.assign(DEF().p,s.p)})}}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}return DEF()}
let S=load(),N={d:new Date().toISOString().slice(0,10)},EX=null,ERR=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
// ---------- Cálculos ----------
function calc(p){
 const lm=p.grasa?p.peso*(1-p.grasa/100):null,k=p.peso/70;
 const bmr=lm?370+21.6*lm:10*p.peso+6.25*p.altura-5*p.edad+(p.sexo=='h'?5:-161);
 const fn=lm?'Katch-McArdle (masa magra '+lm.toFixed(1)+' kg)':'Mifflin-St Jeor';
 const neat=(p.pasos||0)*.04*k+{sed:0,mod:120,act:300}[p.trab];
 const tr=p.dias*(p.dur||0)*({pesas:5,cardio:8,cali:5.5,dep:7,mixto:6.5,otro:5}[p.tipo])*k/7,car=(p.cardio||0)*k;
 let tdee=bmr*1.1+neat+tr+car,corr=false;
 if(p.ingesta&&p.pesoPrev&&Math.abs(p.pesoPrev-p.peso)<=.5){tdee=(tdee+p.ingesta)/2;corr=true}
 const ADJ={grasa:-.18,peso:-.15,recomp:-.05,musculo:.1,subir:.12,mant:0,mejora:-.05,rend:.05,otro:0};
 let adj=ADJ[p.obj]*(ADJ[p.obj]<0&&p.ritmo=='suave'?.6:1);
 const safe=p.edad<18||p.cond.includes('emb')||p.cond.includes('tca');if(safe&&adj<0)adj=0;
 const fl=p.sexo=='h'?1500:1200;let kcal=tdee*(1+adj);if(adj<0)kcal=Math.max(kcal,Math.min(tdee,Math.max(fl,bmr)));
 const ppk={grasa:2,peso:1.8,recomp:2,musculo:1.8,subir:1.6,mant:1.6,mejora:1.8,rend:1.6,otro:1.6}[p.obj];
 let P=Math.min(ppk*p.peso,.35*kcal/4),Fa=Math.max(.8*p.peso,.25*kcal/9);P=rd(P);Fa=rd(Fa);
 const C=Math.max(0,rd((kcal-4*P-9*Fa)/4)),kc=4*P+4*C+9*Fa;
 return{bmr:rd(bmr),fn,tdee:rd(tdee),kcal:kc,P,F:Fa,C,fib:rd(14*kc/1000),adj:kc/tdee-1,ppk:P/p.peso,corr,safe}}
function risks(p,c){const r=[],cd=p.cond;
 if(p.edad<18)r.push('Eres menor de edad: las necesidades cambian con el crecimiento. Estas cifras son solo informativas y debe supervisarlas un profesional sanitario.');
 if(cd.includes('emb'))r.push('Embarazo o lactancia: no se aplican déficits. Consulta con tu matrona, médico o dietista-nutricionista.');
 if(cd.includes('tca'))r.push('Trastornos de la conducta alimentaria (actuales o pasados): conviene que un profesional sanitario acompañe cualquier plan. Se evitan déficits.');
 if(cd.includes('enf'))r.push('Condición médica relevante (metabólica, renal, hepática o digestiva): consulta con tu equipo médico antes de seguir un plan.');
 if(cd.includes('med'))r.push('Medicación que afecta al peso, apetito o metabolismo: pide supervisión profesional.');
 if(cd.includes('rest'))r.push('Con antecedentes de dietas muy restrictivas, prioriza un enfoque flexible y sostenible, idealmente con apoyo profesional.');
 if(p.ingesta&&p.ingesta<1200)r.push('Tu ingesta actual es muy baja. No se recomienda reducir más; consulta con un profesional.');
 if(p.pesoObj&&Math.abs(p.pesoObj-p.peso)/p.peso>.3)r.push('Tu peso objetivo implica un cambio superior al 30 %. Divídelo en etapas y consúltalo con un profesional.');
 if(p.peso/(p.altura/100)**2<18.5&&c.adj<0)r.push('Tu IMC está por debajo de 18,5: no es recomendable un déficit calórico.');
 return r}
// ---------- Validación ----------
const V=(c,m)=>c?'':m,inR=(x,a,b)=>x!==''&&x!==undefined&&x>=a&&x<=b;
function validate(s){const p=S.p,e=[];
 if(s==1){e.push(V(inR(p.edad,12,90),'Introduce una edad entre 12 y 90 años.'),V(p.sexo,'Selecciona el sexo biológico usado en el cálculo metabólico.'),V(inR(p.peso,30,300),'Introduce un peso válido en kilogramos (30–300).'),V(inR(p.altura,120,230),'Introduce una altura válida en centímetros (120–230).'));if(p.grasa!==''&&p.grasa!==undefined)e.push(V(inR(p.grasa,3,60),'El porcentaje de grasa debe estar entre 3 y 60, o déjalo vacío si no lo conoces.'))}
 if(s==2&&p.pesoObj)e.push(V(inR(p.pesoObj,30,300),'El peso objetivo debe estar en kilogramos (30–300) o déjalo vacío.'));
 if(s==3)e.push(V(inR(p.pasos,0,50000),'Indica tus pasos diarios aproximados (0–50000).'),V(inR(p.dias,0,7),'Los días de entrenamiento deben ser de 0 a 7.'),V(p.dias==0||inR(p.dur,10,300),'Indica la duración media de la sesión (10–300 min).'),V(!p.cardio||inR(p.cardio,0,1500),'Los minutos de cardio por semana deben ser de 0 a 1500.'));
 if(s==4)e.push(V(!p.ingesta||inR(p.ingesta,500,8000),'La ingesta aproximada debe estar entre 500 y 8000 kcal, o déjala vacía.'),V(!p.pesoPrev||inR(p.pesoPrev,30,300),'El peso de hace 4 semanas debe estar en kilogramos o déjalo vacío.'));
 if(s==6)e.push(V(inR(p.nc,2,5),'Elige entre 2 y 5 comidas principales.'),V(inR(p.ns,0,3),'Elige entre 0 y 3 snacks.'));
 ERR=e.filter(Boolean);return!ERR.length}
// ---------- Generador de menús ----------
const nrm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function ok(f){const p=S.p;if(f.al&&(p.alerg.includes(f.al)||p.intol.includes(f.al)))return false;
 const d=p.dieta;if(d=='pesc'&&f.kind=='m'||d=='veg'&&'mf'.includes(f.kind)||d=='vegan'&&f.kind!='p')return false;
 return!(p.nogusta||'').split(',').map(t=>nrm(t.trim())).some(t=>t.length>2&&nrm(f.name).includes(t))}
function pick(role,t){const a=Object.values(F).filter(f=>f.role==role&&ok(f)),b=a.filter(f=>f.slot.includes(t)),l=b.length?b:a;return l.length?l[Math.random()*l.length|0]:null}
function genMeal(t,tg){const P=pick('P',t),C=pick('C',t),Fa=pick('F',t),Vg=pick('V',t),it=[],a={p:0,f:0,c:0};
 const add=(f,g)=>{g=r5(g);if(g<10)return;it.push({id:f.id,g});a.p+=f.p*g/100;a.f+=f.f*g/100;a.c+=f.c*g/100},cap=(f,g,m)=>Math.min(g,m*100/f.k);
 if(Vg)add(Vg,t=='m'?120:100);if(P)add(P,cap(P,(tg.P-a.p)*100/P.p,600));if(C)add(C,cap(C,(tg.C-a.c)*100/C.c,700));if(Fa)add(Fa,cap(Fa,(tg.F-a.f)*100/Fa.f,270));
 return it}
function slots(){const{nc,ns}=S.p,M={2:[['Comida','m',1.1],['Cena','m',1]],3:[['Desayuno','b',.8],['Comida','m',1.1],['Cena','m',1]],4:[['Desayuno','b',.8],['Comida','m',1.1],['Merienda','s',.6],['Cena','m',1]],5:[['Desayuno','b',.8],['Media mañana','s',.6],['Comida','m',1.1],['Merienda','s',.6],['Cena','m',1]]}[nc],r=[];
 M.forEach((m,i)=>{r.push(m);if(i<ns)r.push(['Snack '+(i+1),'s',.4])});for(let i=nc;i<ns;i++)r.push(['Snack '+(i+1),'s',.4]);return r}
function genDay(){const c=calc(S.p),sl=slots(),w=sl.reduce((a,s)=>a+s[2],0);
 return sl.map(s=>{const f=s[2]/w,tg={P:c.P*f,F:c.F*f,C:c.C*f,k:c.kcal*f};return{n:s[0],t:s[1],tg,items:genMeal(s[1],tg)}})}
function gen(){S.plan=Array.from({length:S.p.nd},genDay);S.buy=null;save()}
const tot=it=>it.reduce((a,x)=>{const f=F[x.id],m=x.g/100;a.k+=f.k*m;a.p+=f.p*m;a.f+=f.f*m;a.c+=f.c*m;a.fi+=f.fi*m;return a},{k:0,p:0,f:0,c:0,fi:0});
const dayTot=d=>tot(d.flatMap(m=>m.items));
function st(x,t){const d=Math.abs(x-t)/t;return d<=.05?['ok','Dentro del objetivo']:d<=.1?['warn',x>t?'Ligeramente por encima':'Ligeramente por debajo']:['bad','Fuera de rango']}
// ---------- Seguimiento ----------
function evalLog(){const L=[...S.log].filter(x=>x.peso).sort((a,b)=>a.d<b.d?-1:1);
 if(L.length<4)return'Registra al menos 4 pesajes repartidos en dos semanas o más antes de valorar ajustes.';
 const t=x=>new Date(x).getTime()/864e5,xs=L.map(x=>t(x.d)),ys=L.map(x=>x.peso),n=L.length;
 if(xs[n-1]-xs[0]<14)return'Todavía hay menos de 14 días de datos. Mantén tus calorías actuales.';
 const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n,sl=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/xs.reduce((s,x)=>s+(x-mx)**2,0)*7,pc=sl/my*100;
 const av=k=>{const v=L.filter(x=>x[k]);return v.length?v.reduce((a,x)=>a+x[k],0)/v.length:null},adh=av('adh'),en=av('en'),ha=av('ham');
 const tend='Tendencia: '+(sl>=0?'+':'')+sl.toFixed(2)+' kg/semana ('+pc.toFixed(2)+' %). ';
 if(adh!==null&&adh<70)return tend+'Tu adherencia media es baja: mejora la constancia antes de tocar las calorías.';
 const o=S.p.obj,loss=['grasa','peso','mejora'].includes(o),gain=['musculo','subir'].includes(o);
 if(loss&&pc>-.1)return tend+(en!==null&&en<=2||ha!==null&&ha>=4?'Con energía baja o mucha hambre, no recortes más; revisa sueño y estrés.':'Podrías reducir unas 100 kcal/día (≈5 %) y reevaluar en 2 semanas.');
 if(loss&&pc<-1)return tend+'Pierdes peso demasiado rápido. Sube unas 100–150 kcal/día.';
 if(gain&&pc<.05)return tend+'Podrías añadir unas 100 kcal/día (≈5 %) y reevaluar en 2 semanas.';
 if(gain&&pc>.5)return tend+'Ganas más rápido de lo prudente. Reduce unas 100 kcal/día.';
 if(!loss&&!gain&&Math.abs(pc)>.3)return tend+'Tu peso no está estable: ajusta ±100 kcal/día en la dirección contraria.';
 return tend+'Vas en un ritmo razonable. Mantén las calorías y sigue registrando.'}
// ---------- Vistas ----------
const g=k=>S.p[k]??'';
const inp=(k,l,t='number',a='')=>`<label>${l}<input data-k="p.${k}" type="${t}" value="${g(k)}" ${a}></label>`;
const sel=(k,l,o)=>`<label>${l}<select data-k="p.${k}">${o.map(([v,t])=>`<option value="${v}" ${g(k)==v?'selected':''}>${t}</option>`).join('')}</select></label>`;
const ck=(k,o)=>o.map(([v,t])=>`<label class="chk"><input type="checkbox" data-ck="${k}" value="${v}" ${S.p[k].includes(v)?'checked':''}>${t}</label>`).join('');
const H=(t,d)=>`<h2>${t}</h2><p class="mut">${d}</p>`;
const AL=Object.entries(ALG);
const VIEW=[
()=>`<div class="hero"><h1>Tu nutri wannabe María 💅</h1><p>Sin bata ni diploma, pero con fórmulas de verdad. Calcula tus calorías y macros, genera menús sin tus alérgenos, ajusta porciones, haz la lista de la compra y sigue tu progreso.</p>
<div class="al"><b>Son estimaciones.</b> María es wannabe: no sustituye a un dietista-nutricionista ni a un profesional sanitario, y no ofrece diagnósticos.</div>
<div class="row"><button class="p" data-a="go:1">Empezar</button>${S.p.peso?`<button data-a="go:5">Cargar mis datos guardados</button>`:''}<button data-a="sample">Probar con datos de ejemplo</button></div>
<div class="card"><h3>Privacidad y seguridad</h3><p class="mut">Tus datos se guardan solo en este navegador (localStorage). No se envían a ningún servicio externo. Puedes borrarlos cuando quieras desde el pie de página.</p></div></div>`,
